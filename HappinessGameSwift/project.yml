name: HappinessGameSwift
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.5"
  xcodeVersion: "16.4"

settings:
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "18.5"
  TARGETED_DEVICE_FAMILY: "1,2"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: "Automatic"
  ENABLE_PREVIEWS: "YES"
  GENERATE_INFOPLIST_FILE: "YES"
  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
  INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "写真と動画をアップロードするために使用します"
  INFOPLIST_KEY_NSCameraUsageDescription: "写真と動画を撮影するために使用します"
  INFOPLIST_KEY_NSMicrophoneUsageDescription: "動画撮影時に音声を録音するために使用します"

targets:
  HappinessGameSwift:
    type: application
    platform: iOS
    sources:
      - path: HappinessGameSwift
        excludes:
          - "*.plist"
    resources:
      - path: HappinessGameSwift/Assets.xcassets
      - path: images
      - path: Audio
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.HappinessGameSwift
      PRODUCT_NAME: HappinessGameSwift
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: HappinessGameSwift/Info.plist
      properties:
        CFBundleDisplayName: Happiness Game
        CFBundleIdentifier: com.example.HappinessGameSwift
        CFBundleName: HappinessGameSwift
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  HappinessGameSwift:
    build:
      targets:
        HappinessGameSwift: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
